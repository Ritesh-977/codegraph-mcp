[project]
name = "codegraph-mcp"
version = "0.1.0"
description = "Knowledge-Graph MCP Server for GitHub repos — Neo4j-backed code dependency graph"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "codegraph-mcp contributors" }]
keywords = ["mcp", "model-context-protocol", "neo4j", "code-graph", "tree-sitter"]

dependencies = [
    "mcp>=1.27,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "neo4j>=5.20,<6",
    "gitpython>=3.1,<4",
    "pathspec>=0.12,<1",
    "tree-sitter>=0.23,<1",
    "tree-sitter-javascript>=0.23,<1",
    "tree-sitter-typescript>=0.23,<1",
]

[project.optional-dependencies]
dev = [
    "mcp[cli]>=1.27,<2",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<7",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "testcontainers[neo4j]>=4.0,<5",
    "httpx>=0.27,<1",
]

[project.scripts]
codegraph = "codegraph.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codegraph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (excluded from CI default run)",
    "integration: requires a live Neo4j instance (testcontainer or env)",
    "contract: golden-snapshot tests of the tools/list JSON Schemas",
]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["codegraph"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src/codegraph"]

[[tool.mypy.overrides]]
module = ["tree_sitter", "tree_sitter.*", "tree_sitter_javascript", "tree_sitter_typescript"]
follow_imports = "skip"
ignore_errors = true